# Weekly dependency update PRs (security checklist: dependency scanning).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [minor, patch] }
  - package-ecosystem: pip
    directory: /worker
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directories: [/backend, /worker, /frontend, /infra/local-cdn]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: [/infra/terraform/bootstrap, /infra/terraform/app]
    schedule: { interval: weekly }
