name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: streaming
          POSTGRES_USER: streaming
          POSTGRES_PASSWORD: streaming
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streaming" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: streaming
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: streaming
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest -q

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: streaming
          POSTGRES_USER: streaming
          POSTGRES_PASSWORD: streaming
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streaming" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: streaming
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -rs  # includes real FFmpeg encodes and the claim SQL against Postgres

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Local CDN cookie verifier
        working-directory: infra/local-cdn
        run: |
          pip install boto3==1.40.0 cryptography==45.0.7 pytest==8.4.2
          pytest -q -p no:cacheprovider
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform (media)
        working-directory: infra/terraform/media
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  images:
    runs-on: ubuntu-latest
    needs: [backend, worker, infra, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build encoder image
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build nginx + frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
