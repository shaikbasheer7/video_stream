name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: streaming
          POSTGRES_USER: streaming
          POSTGRES_PASSWORD: streaming
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streaming" --health-interval 5s --health-timeout 3s --health-retries 10
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 12
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: streaming
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: streaming
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest -q
      - name: Production settings pass Django's deploy checks
        run: |
          DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))') \
            python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: example.com

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: streaming
          POSTGRES_USER: streaming
          POSTGRES_PASSWORD: streaming
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streaming" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: streaming
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -rs  # includes real FFmpeg encodes and the claim SQL against Postgres

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Local CDN cookie verifier
        working-directory: infra/local-cdn
        run: |
          pip install boto3==1.40.0 cryptography==50.0.2 pytest==9.0.3
          pytest -q -p no:cacheprovider
      - name: Deploy scripts (render_env tests, shellcheck)
        run: |
          pip install pytest==9.0.3
          pytest -q -p no:cacheprovider deploy/tests
          shellcheck deploy/deploy.sh deploy/ci-deploy.sh infra/terraform/check.sh backend/docker-entrypoint.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform (fmt + validate every root and module, no AWS access)
        working-directory: infra/terraform
        run: sh check.sh
      - name: Terraform security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Build every image and scan it. Fails on fixable CRITICAL/HIGH vulnerabilities.
  data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements*.txt
      - uses: actions/setup-java@v4 # the Spark tests run real local Spark
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -p no:cacheprovider
      - name: Dashboard bundle builds
        run: python superset/build_assets.py /tmp/dashboards.zip
        env:
          ANALYTICS_RO_PASSWORD: ci-placeholder
      - name: Data stack images build
        run: |
          docker build -q -f airflow/Dockerfile -t streaming-airflow:ci .
          docker build -q -f superset/Dockerfile -t streaming-superset:ci .
          docker build -q -t streaming-connect:ci ../infra/connect
      - name: Real embedding model test (the image has the model baked in)
        run: |
          docker run --rm -v "$PWD:/work" -w /work --entrypoint sh streaming-airflow:ci -c \
            "pip install -q --user pytest==9.0.3 && python -m pytest -q -p no:cacheprovider tests/test_model.py"

  images:
    runs-on: ubuntu-latest
    needs: [backend, worker, infra, frontend, data]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
          - name: encoder
            context: worker
            file: worker/Dockerfile
          - name: ml
            context: worker
            file: worker/ml.Dockerfile
          - name: web
            context: .
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: streaming-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: streaming-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
