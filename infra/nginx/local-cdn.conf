# Local development only (mounted by docker-compose.yml): the CloudFront stand-in at /cdn/.
location /cdn/ {
    set $cdn_upstream http://cdn:8090;  # a variable, so the address is looked up again: see default.conf.template
    rewrite ^/cdn/(.*)$ /$1 break;
    proxy_pass $cdn_upstream;
    proxy_set_header Cookie $http_cookie;
    proxy_http_version 1.1;
}
