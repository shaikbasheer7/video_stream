# For responses nginx serves itself (the React app). Django sets its own headers on /api and /admin,
# so these are not added there (duplicate X-Frame-Options headers can be treated as invalid).
# Note: a location that uses add_header must include this file; nginx doesn't inherit add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # ignored over plain HTTP
add_header X-Request-ID $request_id always;
